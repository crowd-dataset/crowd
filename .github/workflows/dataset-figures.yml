---
############################
# Refresh README statistics and dataset figures once a week, on Sunday night,
# when mapping.csv changed since the last refresh (user, 2026-10-13: not after
# every push of the mapping). The mapping-NAME.csv files play no part: they
# neither start a run nor go into it.
# Runs analysis.py without the YOLO bbox CSVs (no data folders). The object
# counts come from the committed figures/detection_counts.csv, which a local
# run of analysis.py with the data folders refreshes.
############################
name: Dataset figures

on:
  schedule:
    # Sunday 21:00 UTC: 23:00 in the Netherlands in summer, 22:00 in winter
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dataset-figures
  cancel-in-progress: true

jobs:
  changed:
    name: Mapping changed since the last refresh?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The bot's last refresh commit; mapping.csv commits after it mean a run.
      - name: Check
        id: check
        run: |
          last=$(git log -1 --format=%H \
            --grep='^Update README statistics and dataset figures$')
          if [ -z "$last" ] || \
              [ -n "$(git log --format=%H "$last"..HEAD -- mapping.csv)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No change to mapping.csv since $last: nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  figures:
    name: Update README and figures
    needs: changed
    # a run started by hand always refreshes
    if: >-
      needs.changed.outputs.run == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Out of the analysis (and so of video_contributors.csv): videos are
      # credited from mapping.csv alone; put back before committing.
      - name: Leave out the mapping-NAME files
        run: |
          mkdir -p /tmp/mapping-names
          for f in mapping-*.csv; do
            [ -e "$f" ] && mv "$f" /tmp/mapping-names/
          done
          true

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Default settings, analysis forced, no data or video folders,
      # empty API keys (not needed for the mapping-only figures).
      - name: Create config and secret
        run: |
          python3 - <<'EOF'
          import json
          c = json.load(open("default.config"))
          c.update(always_analyse=True, data=[], videos=[])
          json.dump(c, open("config", "w"), indent=2)
          keys = json.load(open("default.secret"))
          json.dump({k: "" for k in keys}, open("secret", "w"), indent=2)
          EOF

      # Only the packages the analysis and figures need (not torch/YOLO).
      - name: Run analysis
        run: >-
          uv run --no-project --python 3.12
          --with polars --with pyarrow --with pandas==2.2.3
          --with plotly==5.24.1 --with kaleido==0.2.1
          --with pillow --with tqdm --with numpy --with pycountry
          python analysis.py

      # Commits made with GITHUB_TOKEN do not trigger further workflow runs.
      - name: Commit updated README and figures
        run: |
          mv /tmp/mapping-names/* . 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md figures video_contributors.csv
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update README statistics and dataset figures"
            # a commit pushed while this ran (one that leaves mapping.csv alone starts no run of its own) would
            # reject the push: put the figures on top of it
            git pull --rebase origin main
            git push
          fi
