<script>
const LAPTOP = 3600 > 60;          // the laptop: fewer frames and hourly data (battery)
const FIGURE = window.GLOBE;              // the README figure: its data built in, no widget server
// the figure's data, fresher than its own: the globe on bazilinskyy.github.io, rebuilt every night from the mapping on
// GitHub (each place with its longest segment, played on a click)
const LIVE = 'https://bazilinskyy.github.io/js/crowd-globe.json';
const FPS = LAPTOP ? 8 : 10, SPEED = 5;   // frames per second, degrees per second (the mini's worker shares its CPU)
const cv = document.getElementById('g'), ctx = cv.getContext('2d'), tip = document.getElementById('tip');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = n => n.toLocaleString();
let size, proj, path, land, borders, tiers = [[], [], []], data, rot = [-10, -22], hover = false, held = 0, lastT = 0, shown = [];
const grat = d3.geoGraticule10();

function setup() {
  size = Math.min(document.body.clientWidth - 20, FIGURE ? innerHeight - 70 : 420);
  const dpr = devicePixelRatio || 1;
  cv.width = cv.height = Math.round(size * dpr); cv.style.width = cv.style.height = size + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  proj = d3.geoOrthographic().scale(size / 2 - 2).translate([size / 2, size / 2]).clipAngle(90).precision(1.5);
  path = d3.geoPath(proj, ctx);
}

function draw(t) {
  proj.rotate(rot);
  ctx.clearRect(0, 0, size, size);
  ctx.beginPath(); path({type: 'Sphere'}); ctx.fillStyle = css('--sea'); ctx.fill();
  ctx.beginPath(); path(grat); ctx.strokeStyle = css('--grat'); ctx.lineWidth = 0.6; ctx.stroke();
  if (land) {
    ctx.beginPath(); path(land); ctx.fillStyle = css('--land'); ctx.fill();
    ctx.beginPath(); path(borders); ctx.strokeStyle = css('--border'); ctx.lineWidth = 0.5; ctx.stroke();
  }
  // the points by hand (orthographic, centre at -rot): a few multiplications each instead of d3's projection
  const R = size / 2 - 2, c0 = size / 2, lon0 = -rot[0] * Math.PI / 180, lat0 = -rot[1] * Math.PI / 180;
  const s0 = Math.sin(lat0), k0 = Math.cos(lat0), pulse = (t / 1600) % 1;
  shown = [];
  const place = p => {
    const dl = p.lon - lon0, cd = Math.cos(dl);
    if (s0 * p.s + k0 * p.k * cd < 0.02) return null;  // on the far side
    return [c0 + R * p.k * Math.sin(dl), c0 - R * (k0 * p.s - s0 * p.k * cd)];
  };
  tiers.forEach((list, tier) => {  // older first (small squares), then the last days, then today on top
    ctx.beginPath();
    for (const p of list) {
      const xy = place(p);
      if (!xy) continue;
      const [x, y] = xy;
      if (tier) { const r = 2.6 + tier * 0.5; ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, 2 * Math.PI); }
      else ctx.rect(x - p.r, y - p.r, 2 * p.r, 2 * p.r);
      shown.push([x, y, p]);
    }
    ctx.globalAlpha = tier ? 1 : 0.6;
    ctx.fillStyle = css(['--old', '--recent', '--day'][tier]); ctx.fill();
    if (tier) { ctx.lineWidth = 0.8; ctx.strokeStyle = css('--bg'); ctx.stroke(); }
    ctx.globalAlpha = 1;
  });
  ctx.beginPath();  // today's places pulse
  for (const p of tiers[2]) {
    const xy = place(p);
    if (!xy) continue;
    const r = 3.1 + 9 * pulse;
    ctx.moveTo(xy[0] + r, xy[1]); ctx.arc(xy[0], xy[1], r, 0, 2 * Math.PI);
  }
  ctx.globalAlpha = 0.7 * (1 - pulse); ctx.strokeStyle = css('--day'); ctx.lineWidth = 1.2; ctx.stroke(); ctx.globalAlpha = 1;
}

// it turns only while someone can see it: this user's session on the screen, unlocked, display on (/active)
let active = true, running = false, paused = false;  // paused: by the button, kept in this Chrome profile
try { paused = localStorage.getItem('globe-paused') === '1'; } catch (e) {}
function frame(t) {
  if (!active || document.hidden || paused) { running = false; return; }  // the loop stops; start() resumes it
  requestAnimationFrame(frame);
  if (t - lastT < 1000 / FPS) return;
  if (!hover && t > held) rot[0] += SPEED * Math.min(t - lastT, 250) / 1000;
  lastT = t;
  draw(t);
}
function start() {
  if (running || !active || document.hidden || paused) return;
  running = true; lastT = performance.now(); requestAnimationFrame(frame);
}
async function check() {
  try { active = (await (await fetch('active', {cache: 'no-store'})).json()).active; } catch (e) { active = true; }
  start();
}

async function live() {  // the website's data in the widget's form, or the figure's own if the website is down
  try {
    const d = await (await fetch(LIVE, {cache: 'no-cache'})).json();
    return {date: d.built.slice(0, 10), localities: d.localities, hours: d.hours, recent: d.month, day: d.week,
            recent_places: d.month_places, day_places: d.week_places,
            points: d.points.map(([lat, lon, h, videos, month, week, name, video, start]) =>
              [lat, lon, h, month, week, name, video, start])};
  } catch (e) { return FIGURE; }
}

async function load() {
  try {
    data = FIGURE ? await live() : await (await fetch('globe.json', {cache: 'no-store'})).json();
    if (data.error) throw new Error(data.error);
  } catch (e) { document.getElementById('stamp').textContent = 'unreachable (TU/e only)'; return; }
  tiers = [[], [], []];
  for (const [lat, lon, h, rec, day, name, video, start] of data.points)
    tiers[day ? 2 : rec ? 1 : 0].push({lon: lon * Math.PI / 180, s: Math.sin(lat * Math.PI / 180),
      k: Math.cos(lat * Math.PI / 180), r: 0.6 + Math.min(1.9, Math.sqrt(h) / 10), h, rec, day, name, video, start});
  const [dayLabel, recentLabel] = periods();
  document.getElementById('leg').innerHTML =
    `<span><b style="background:var(--day)"></b>${dayLabel}: ${fmt(data.day_places)} places, +${fmt(data.day)} segments</span>` +
    `<span><b style="background:var(--recent)"></b>${recentLabel}: ${fmt(data.recent_places)} places, +${fmt(data.recent)}</span>` +
    `<span><b style="background:var(--old);opacity:.6"></b>${fmt(data.localities)} localities · ${fmt(data.hours)} h</span>`;
  draw(performance.now());  // at once, even while hidden
  document.getElementById('stamp').textContent = FIGURE ? `as of ${data.date}` :
    new Date(data.built * 1000).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
  if (!FIGURE) fit();
}

// the periods of the red and amber places: the widget's day and RECENT_H, the figure's week and month
const periods = () => FIGURE ? ['last week', 'last month'] : ['today', `${Math.round(data.recent_h / 24)} days`];

let height = 0;
function fit() {
  height = document.body.scrollHeight + (outerHeight - innerHeight);
  if (Math.abs(outerHeight - height) > 1) resizeTo(outerWidth, height);
}

function nearest(e) {  // the place within 8 px of the pointer; ties: the newer (drawn later)
  const b = cv.getBoundingClientRect(), mx = e.clientX - b.left, my = e.clientY - b.top;
  let best = null, bd = 64;
  for (const [x, y, p] of shown) { const d = (x - mx) ** 2 + (y - my) ** 2; if (d <= bd) { bd = d; best = p; } }
  return best;
}
cv.addEventListener('click', e => {  // the figure: a place's longest segment on YouTube (d3.drag swallows a drag's click)
  const p = nearest(e);
  if (p && p.video) open(`https://www.youtube.com/watch?v=${encodeURIComponent(p.video)}&t=${p.start}s`, '_blank', 'noopener');
});
cv.addEventListener('mousemove', e => {
  const best = nearest(e);
  hover = true;
  cv.style.cursor = best && best.video ? 'pointer' : '';
  if (!best) { tip.style.display = 'none'; return; }
  const [dayLabel, recentLabel] = periods();
  tip.innerHTML = `<div class="n">${best.name}</div>${fmt(best.h)} h of footage` +
    (best.rec ? `<div class="r">+${fmt(best.rec)} segments in ${FIGURE ? 'the ' : ''}${recentLabel}</div>` : '') +
    (best.day ? `<div class="d">+${fmt(best.day)} ${FIGURE ? 'in the ' : ''}${dayLabel}</div>` : '') +
    (best.video ? '<div class="m">Click to watch its footage on YouTube</div>' : '');
  tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 4) + 'px';
  tip.style.top = Math.min(e.clientY + 12, innerHeight - tip.offsetHeight - 4) + 'px';
});
cv.addEventListener('mouseleave', () => { hover = false; tip.style.display = 'none'; });
d3.select(cv).call(d3.drag().on('drag', e => {
  rot[0] += e.dx * 0.4; rot[1] = Math.max(-80, Math.min(80, rot[1] - e.dy * 0.4));
  held = performance.now() + 4000; draw(performance.now());
}));

setup();
// plotly's world map on UN boundaries: Crimea is part of Ukraine
fetch('https://cdn.plot.ly/un/world_110m.json').then(r => r.json()).then(w => {
  land = topojson.feature(w, w.objects.land);
  borders = topojson.mesh(w, w.objects.countries, (a, b) => a !== b);
  draw(performance.now());
}).catch(() => {});
load(); if (!FIGURE) setInterval(load, Math.max(600, 3600) * 1000);
const pp = document.getElementById('pp');
const label = () => { pp.textContent = paused ? '▶ turn' : '⏸ pause'; };
pp.onclick = () => {
  paused = !paused;
  try { localStorage.setItem('globe-paused', paused ? '1' : '0'); } catch (e) {}
  label();
  if (paused) draw(performance.now()); else start();
};
label();
if (FIGURE) {  // a page of its own: it turns while visible
  addEventListener('resize', () => { setup(); draw(performance.now()); });
  document.addEventListener('visibilitychange', start); start();
} else {
  check(); setInterval(check, LAPTOP ? 15000 : 3000);
  document.addEventListener('visibilitychange', check);
  dock('globe', height); setInterval(() => dock('globe', height), LAPTOP ? 60000 : 5000);
  addEventListener('focus', () => LAPTOP && load());
}
</script></body></html>
